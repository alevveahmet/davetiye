<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Alev & Ahmet Davetiye</title>
    <meta name="description" content="Mutluluğumuza ortak olmanızdan onur duyarız.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://alevveahmet.github.io/davetiye/">
    <meta property="og:title" content="Alev & Ahmet Davetiye">
    <meta property="og:description" content="Düğünümüze davetlisiniz! Detaylar için tıklayın.">
    
    <meta property="og:image" content="https://alevveahmet.github.io/davetiye/1.jpg?v=20">
    <meta property="og:image:secure_url" content="https://alevveahmet.github.io/davetiye/1.jpg?v=20">
    <meta property="og:image:type" content="image/jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <style>
        body { 
            margin: 0; padding: 0; background-color: #fdfaf6; 
            font-family: 'Georgia', serif; overflow-x: hidden; 
        }
        .container { max-width: 500px; margin: 0 auto; background: #fff; }

        .img-wrapper { 
            width: 100%; min-height: 400px; 
            overflow: hidden; line-height: 0; background-color: #fdfaf6;
        }
        
        img { 
            width: 100%; height: auto; display: block;
            opacity: 0; 
            filter: blur(20px); 
            transform: scale(1.1); 
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        img.is-visible { 
            opacity: 1; 
            filter: blur(0); 
            transform: scale(1); 
        }

        .footer { padding: 60px 20px; text-align: center; }
        
        .btn-konum {
            display: inline-block; padding: 18px 45px; 
            border: 1px solid #8a7352; color: #8a7352;
            text-decoration: none; border-radius: 2px;
            font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
            transition: 0.4s;
        }

        .btn-konum:hover { background: #8a7352; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="img-wrapper"><img src="1.jpg"></div>
        <div class="img-wrapper"><img src="2.jpg"></div>

        <div class="footer">
            <p style="font-style: italic; color: #a5937d; margin-bottom: 25px;">"Bir ömür boyu el ele..."</p>
            <a href="https://maps.app.goo.gl/zV8h8c9HHJ3DePx56" target="_blank" class="btn-konum">ADRESİ GÖRÜNTÜLE</a>
            <p style="margin-top: 40px; font-size: 11px; color: #ccc;">ALEV & AHMET</p>
        </div>
    </div>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, { threshold: 0.15 });

        document.querySelectorAll('img').forEach(img => observer.observe(img));
    </script>
</body>
</html>
