<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alev & Ahmet Davetiye</title>
    <style>
        /* GENEL TASARIM */
        body { margin: 0; padding: 0; background-color: #f8f5f0; font-family: 'Georgia', serif; color: #5a4a35; }
        .container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; }
        
        /* GÖRSEL VE ANİMASYON */
        img { width: 100%; height: auto; display: block; opacity: 0; transform: translateY(20px); transition: all 1s ease-out; }
        img.visible { opacity: 1; transform: translateY(0); }

        /* GERİ SAYIM ALANI */
        .countdown-section { background: #fff; padding: 30px 10px; text-align: center; border-bottom: 1px solid #e0d5c1; }
        #timer { display: flex; justify-content: space-around; margin-top: 10px; font-weight: bold; color: #8a7352; }
        .unit { font-size: 24px; }
        .label { font-size: 10px; color: #a5937d; text-transform: uppercase; display: block; }

        /* KONUM BUTONU (PULSE ANİMASYONLU) */
        .btn-area { padding: 40px 20px; text-align: center; background: #f8f5f0; }
        .btn { 
            display: inline-block; padding: 16px 35px; background: #8a7352; color: white; 
            text-decoration: none; border-radius: 50px; font-size: 17px; 
            box-shadow: 0 5px 15px rgba(138, 115, 82, 0.3);
            animation: pulse 2.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="1.jpg" alt="Alev & Ahmet" class="reveal">

        <div class="countdown-section">
            <small style="letter-spacing: 1px;">DÜĞÜNÜMÜZE KALAN SÜRE</small>
            <div id="timer">
                <div><span class="unit" id="days">00</span><span class="label">Gün</span></div>
                <div><span class="unit" id="hours">00</span><span class="label">Saat</span></div>
                <div><span class="unit" id="minutes">00</span><span class="label">Dakika</span></div>
                <div><span class="unit" id="seconds">00</span><span class="label">Saniye</span></div>
            </div>
        </div>

        <img src="3.jpg" alt="Davetiye Bilgileri" class="reveal">

        <div class="btn-area">
            <a href="BURAYA_HARITA_LİNKİNİ_YAPISTIR" target="_blank" class="btn">📍 Konum ve Yol Tarifi</a>
            <p style="margin-top: 20px; font-size: 14px; font-style: italic;">Mutluluğumuza ortak olmanız dileğiyle...</p>
        </div>
    </div>

    <script>
        // Görsellerin ekrana süzülerek gelmesi
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('img').forEach(img => observer.observe(img));

        // Geri Sayım Fonksiyonu
        const target = new Date(2026, 5, 6, 13, 0).getTime(); // 6 Haziran 2026
        setInterval(() => {
            const now = new Date().getTime();
            const d = target - now;
            document.getElementById("days").innerText = Math.floor(d / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((d % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((d % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((d % (1000 * 60)) / 1000);
        }, 1000);
    </script>
</body>
</html>
