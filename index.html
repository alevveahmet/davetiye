<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alev & Ahmet Davetiye</title>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://alevveahmet.github.io/davetiye/">
    <meta property="og:title" content="Alev & Ahmet Davetiye">
    <meta property="og:description" content="Mutluluğumuza ortak olmanız dileğiyle...">
    <meta property="og:image" content="https://alevveahmet.github.io/davetiye/1.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <style>
        body { margin: 0; background: #fdfaf6; font-family: 'Georgia', serif; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .img-wrapper { width: 100%; min-height: 400px; overflow: hidden; line-height: 0; }
        img { width: 100%; height: auto; display: block; opacity: 0; filter: blur(20px); transition: 2s all ease; }
        img.is-visible { opacity: 1; filter: blur(0); }
        
        .footer { padding: 40px 20px 60px; text-align: center; }
        
        /* HARİTA STİLİ */
        .map-container {
            width: 90%;
            margin: 30px auto;
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #e0dcd5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        iframe { width: 100%; height: 100%; border: none; }

        .btn { 
            display: inline-block; padding: 18px 45px; 
            border: 1px solid #8a7352; color: #8a7352; 
            text-decoration: none; letter-spacing: 2px; 
            text-transform: uppercase; font-size: 13px;
            transition: 0.4s;
        }
        .btn:hover { background: #8a7352; color: #fff; }

        /* MÜZİK BUTONU */
        #music-control {
            position: fixed; bottom: 20px; right: 20px;
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(138, 115, 82, 0.8); color: white;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000; border: none; font-size: 20px;
            animation: rotate 4s linear infinite; animation-play-state: paused;
        }
        #music-control.playing { animation-play-state: running; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="myAudio" loop><source src="muzik.mp3" type="audio/mpeg"></audio>
    <button id="music-control" onclick="toggleMusic()">🎵</button>

    <div class="container">
        <div class="img-wrapper"><img src="1.jpg"></div>
        <div class="img-wrapper"><img src="2.png"></div>

        <div class="footer">
            <p style="font-style: italic; color: #a5937d; margin-bottom: 10px;">Düğün Konumu</p>
            
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3052.354472922367!2d31.887199076495026!3d40.08980907547128!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14d2bc3cb0666ae9%3A0x96c0c41cffa6d253!2zQmV5cGF6YXLEsSBBcyBCYWzEsWvDp8SxbMSxaw!5e0!3m2!1str!2str!4v1775559005440!5m2!1str!2str" 
                    allowfullscreen="" loading="lazy">
                </iframe>
            </div>

            <a href="https://maps.google.com/?cid=2584280382034350015&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQ" target="_blank" class="btn">NAVİGASYONDA AÇ</a>
            
            <p style="margin-top: 40px; font-size: 11px; letter-spacing: 2px; color: #ccc;">ALEV & AHMET</p>
        </div>
    </div>

    <script>
        // Müzik ve Görsel Fonksiyonları
        const audio = document.getElementById("myAudio");
        const btn = document.getElementById("music-control");
        function toggleMusic() {
            if (audio.paused) { audio.play(); btn.classList.add("playing"); btn.innerText = "🎶"; }
            else { audio.pause(); btn.classList.remove("playing"); btn.innerText = "🎵"; }
        }
        const obs = new IntersectionObserver((es) => {
            es.forEach(e => { if(e.isIntersecting) e.target.classList.add('is-visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('img').forEach(i => obs.observe(i));
    </script>
</body>
</html>
