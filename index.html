<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Alev & Ahmet Davetiye</title>
    <meta property="og:title" content="Alev & Ahmet Davetiye">
    <meta property="og:description" content="Mutluluğumuza ortak olmanızdan onur duyarız.">
    <meta property="og:image" content="https://alevveahmet.github.io/davetiye/1.jpg?v=1">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:url" content="https://alevveahmet.github.io/davetiye/">
    <meta property="og:type" content="website">

    <style>
        /* TASARIM VE ESTETİK */
        body { 
            margin: 0; padding: 0; background-color: #fdfaf6; 
            font-family: 'Georgia', serif; overflow-x: hidden; 
        }
        .container { max-width: 500px; margin: 0 auto; background: #fff; box-shadow: 0 0 30px rgba(0,0,0,0.02); }

        /* SİNEMATİK KAYDIR-YÜKLE (LAZY REVEAL) EFEKTİ */
        .img-wrapper { 
            width: 100%; min-height: 450px; 
            overflow: hidden; line-height: 0; background-color: #fdfaf6;
        }
        
        img { 
            width: 100%; height: auto; display: block;
            opacity: 0; 
            filter: blur(20px); 
            transform: scale(1.1); 
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        /* Görsel ekrana girince tetiklenecek sınıf */
        img.is-visible { 
            opacity: 1; 
            filter: blur(0); 
            transform: scale(1); 
        }

        /* ALT KISIM VE KONUM BUTONU */
        .footer { padding: 60px 20px; text-align: center; background-color: #fff; }
        
        .btn-konum {
            display: inline-block; padding: 18px 45px; 
            border: 1px solid #8a7352; color: #8a7352;
            text-decoration: none; border-radius: 2px;
            font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
            transition: 0.4s;
            box-shadow: 0 4px 15px rgba(138, 115, 82, 0.1);
        }

        .btn-konum:hover { background: #8a7352; color: #fff; }

        .note { font-style: italic; color: #a5937d; margin-bottom: 25px; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="img-wrapper">
            <img src="1.jpg" alt="Alev & Ahmet Kapak">
        </div>

        <div class="img-wrapper">
            <img src="2.jpg" alt="Davetiye Bilgileri">
        </div>

        <div class="footer">
            <p class="note">"Bir ömür boyu el ele..."</p>
            
            <a href="https://maps.app.goo.gl/zV8h8c9HHJ3DePx56" target="_blank" class="btn-konum">
                ADRESİ GÖRÜNTÜLE
            </a>
            
            <p style="margin-top: 40px; font-size: 11px; letter-spacing: 2px; color: #ccc;">ALEV & AHMET</p>
        </div>
    </div>

    <script>
        /* KAYDIRDIKÇA BELİRME MANTIĞI */
        const observerOptions = {
            root: null,
            threshold: 0.15 
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.classList.add('is-visible');
                    observer.unobserve(img); 
                }
            });
        }, observerOptions);

        document.querySelectorAll('img').forEach(img => {
            observer.observe(img);
        });
    </script>
</body>
</html>
