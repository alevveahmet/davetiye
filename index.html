<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alev & Ahmet</title>
    <style>
        /* GENEL SAYFA TASARIMI */
        body { 
            margin: 0; padding: 0; background-color: #fcfbf8; 
            font-family: 'Georgia', serif; overflow-x: hidden; 
        }
        .container { max-width: 500px; margin: 0 auto; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.05); }

        /* SİNEMATİK NETLEŞME VE ODAKLANMA ANİMASYONU */
        .img-box { overflow: hidden; width: 100%; line-height: 0; }
        
        img { 
            width: 100%; height: auto; display: block;
            filter: blur(10px); /* Başlangıçta bulanık */
            opacity: 0; /* Başlangıçta görünmez */
            transform: scale(1.1); /* Başlangıçta hafif büyük */
            transition: filter 2s ease, opacity 2s ease, transform 2.5s ease-out; 
        }

        /* Ekrana girdiğinde çalışacak animasyon ayarları */
        img.visible { 
            filter: blur(0); 
            opacity: 1; 
            transform: scale(1); /* Orijinal boyutuna yavaşça iner */
        }

        /* ALT KISIM VE KONUM BUTONU */
        .footer { padding: 60px 20px; text-align: center; background-color: #fff; }
        
        .btn-konum {
            display: inline-block; padding: 16px 40px; 
            border: 1px solid #8a7352; color: #8a7352;
            text-decoration: none; border-radius: 2px;
            font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
            transition: 0.4s;
        }

        .btn-konum:hover { background: #8a7352; color: #fff; }

        .note { font-style: italic; color: #a5937d; margin-bottom: 30px; font-size: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="img-box"><img src="1.png" class="reveal"></div>
        <div class="img-box"><img src="2.png" class="reveal"></div>
        <div class="img-box"><img src="3.png" class="reveal"></div>

        <div class="footer">
            <p class="note">"Bir ömür boyu el ele..."</p>
            
            <a href="https://maps.app.goo.gl/BeypazariAsBalikcilik" target="_blank" class="btn-konum">
                ADRESİ GÖRÜNTÜLE
            </a>
            
            <p style="margin-top: 40px; font-size: 11px; letter-spacing: 2px; color: #ccc;">ALEV & AHMET</p>
        </div>
    </div>

    <script>
        // Görseller ekrana gelince animasyonu başlatan kod
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('img').forEach(img => observer.observe(img));
    </script>
</body>
</html>
